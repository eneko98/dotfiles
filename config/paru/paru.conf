# paru, the AUR helper.
#
# paru reads exactly one config file: this one if it exists, otherwise
# /etc/paru.conf. It does not merge them, so the Include below pulls the system
# defaults in first and everything after it is our override.

Include = /etc/paru.conf

[options]
# Keep the sudo timestamp alive while a package compiles for ten minutes.
SudoLoop
# One combined menu for repo and AUR upgrades, with the Arch news printed first.
CombinedUpgrade
UpgradeMenu
NewsOnUpgrade
# Build-only dependencies are removed once the build is done. Without this a
# single Rust or C package leaves its whole toolchain installed forever.
RemoveMake
# And clean the untracked build leftovers out of the clone directory.
CleanAfter
