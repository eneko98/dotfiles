# kitty configuration -- https://sw.kovidgoyal.net/kitty/conf/
#
# Minimal on purpose: only what the terminal needs to be usable. Colours are the
# exception below, because the palette had something to apply them to.

# JetBrainsMono Nerd Font carries the icon glyphs that yazi and the future
# status bar depend on. It is the only font this system has installed.
font_family JetBrainsMono Nerd Font
font_size 11.0

# Do not remember the OS-window size or state between launches. Sizing is the
# compositor's job under a tiling WM, and kitty's default (yes) instead restored
# a saved "maximized" state -- so every new terminal covered the whole work area
# instead of tiling next to the previous one.
remember_window_size no

# Do not ask for confirmation when closing a window with a process in it.
confirm_os_window_close 0

# No terminal bell noise while the system is still being built.
enable_audio_bell no

# ---------------------------------------------------------------------------
# Colours
# ---------------------------------------------------------------------------
# Copied from config/hypr/theme.lua, which is the source of truth, together with
# images/wallpapers/CREDITS.md for where the colours themselves came from.
# kitty cannot read Lua, so this is the one place they are duplicated by hand --
# change theme.lua first, then copy here.
#
# The palette is warm and near-black: surfaces are the photograph's shadow
# colour, text is warm grey, and there are exactly three hues with distinct jobs
# -- gold is the accent, teal is the neon (cursor, links), red is for alarms.
# Nothing here is decoration.

background #0a0708
foreground #ddd4c5

# The cursor is the one element there is always exactly one of, so it is what
# carries the neon accent.
cursor #6fb3ae
cursor_text_color #0a0708

# Links in the same neon, since they are the other "this is the live thing".
url_color #6fb3ae

# Selection is the raised surface colour rather than a hue, so selecting text
# does not invent a fourth meaning.
selection_background #20191b
selection_foreground #ddd4c5

# The 16 ANSI colours the shell and its tools actually print with -- ls, git,
# grep. Derived, not extracted; see theme.lua for why and how.
color0  #2a2426
color8  #4a4144
color1  #c2452f
color9  #e0644a
color2  #7d9b6a
color10 #a3c08c
color3  #d3a75a
color11 #f3c562
color4  #5c7f93
color12 #7fa6b8
color5  #b06a72
color13 #d08a8f
color6  #6fb3ae
color14 #95d3cd
color7  #ddd4c5
color15 #f2ece0
