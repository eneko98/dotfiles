# kitty configuration -- https://sw.kovidgoyal.net/kitty/conf/
#
# Minimal on purpose: only what the terminal needs to be usable. Colours and
# the rest of the theme arrive with the theme pass, as their own commit.

# JetBrainsMono Nerd Font carries the icon glyphs that yazi and the future
# status bar depend on. It is the only font this system has installed.
font_family JetBrainsMono Nerd Font
font_size 11.0

# Do not ask for confirmation when closing a window with a process in it.
confirm_os_window_close 0

# No terminal bell noise while the system is still being built.
enable_audio_bell no
