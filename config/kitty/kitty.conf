# kitty configuration -- https://sw.kovidgoyal.net/kitty/conf/
#
# Minimal on purpose: only what the terminal needs to be usable. Colours are the
# exception below, because the palette had something to apply them to.

# JetBrainsMono Nerd Font carries the icon glyphs that yazi and the future
# status bar depend on. It is the only font this system has installed.
font_family JetBrainsMono Nerd Font
font_size 11.0

# Do not remember the OS-window size or state between launches. Sizing is the
# compositor's job under a tiling WM, and kitty's default (yes) instead restored
# a saved "maximized" state -- so every new terminal covered the whole work area
# instead of tiling next to the previous one.
remember_window_size no

# Do not ask for confirmation when closing a window with a process in it.
confirm_os_window_close 0

# No terminal bell noise while the system is still being built.
enable_audio_bell no

# Breathing room between the text and the window edge. (The compositor owns the
# gaps *between* windows; this owns the space *inside* the window.)
window_padding_width 12

# Slightly translucent so the wallpaper shows through and Hyprland's blur
# (decoration:blur, enabled in hyprland.lua) frosts it. Text stays opaque.
background_opacity 0.92

# The tab bar is hidden until there is more than one tab, and the active tab is
# gold -- the palette's "active" colour, matching the focused window border.
tab_bar_style fade
tab_bar_min_tabs 2

# Keep far more than kitty's 2000-line default before it starts forgetting.
scrollback_lines 10000

# ---------------------------------------------------------------------------
# Colours
# ---------------------------------------------------------------------------
# Generated, not written here. config/hypr/theme.lua is the palette, and
# scripts/gen-theme.py writes config/kitty/theme.conf out of it -- which is why
# this file holds no hex value at all. kitty cannot read Lua, and hand-copying
# the values would let the terminal drift away from the window borders the first
# time the palette changed.
#
# What the colours are, what they are for, and where they came from is in
# theme.lua and images/wallpapers/CREDITS.md.
include theme.conf
