# spotify-player: MPRIS stays on (the island and the Today music card read
# it); notifications are off because the panel is the surface. Streaming is
# always on so librespot plays locally. The OAuth credentials and the cache
# live in ~/.cache/spotify-player, never in this repo.
#
# client_id is the user's own public app (redirect
# http://127.0.0.1:8989/login): the shared ncspot client no longer has a
# matching redirect and its quota is shared by everyone.
theme = "default"
client_id = "3075e9887c5c4efeac430027d164912f"
enable_media_control = true
enable_notify = false
enable_streaming = "Always"

[device]
name = "eneko98"
