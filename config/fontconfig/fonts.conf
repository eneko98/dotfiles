<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The font stack. fontconfig's defaults resolve sans-serif to Source Han Sans CN
  (the CJK face) and monospace to Adwaita Mono, neither of which is what the UI
  should lead with. These aliases pick the lead face for each generic family;
  CJK and emoji still fall back automatically (Source Han Sans CN and Noto Color
  Emoji) because the edit only prepends, it never replaces.

  So: Adwaita Sans for the UI, JetBrainsMono Nerd Font for terminals and code,
  with Chinese and emoji arriving by fallback. Three fonts, no clash.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Adwaita Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
</fontconfig>
