# GTK4 settings. GTK4 dropped the theme-name idea: the base is always Adwaita,
# and a custom look comes from gtk.css sitting beside this file. prefer-dark is
# the one setting libadwaita genuinely honours.

[Settings]
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita-teal
gtk-cursor-theme-name=Bibata-Modern-Ice
gtk-cursor-theme-size=24
