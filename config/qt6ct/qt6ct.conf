; qt6ct: how Qt 6 apps choose their style and palette.
;
; style=Fusion is Qt's flat built-in style; the colours come from the generated
; colors/theme.conf (color_scheme_path uses $HOME, so it stays correct wherever
; the repo is cloned). This only reaches Qt apps while
; QT_QPA_PLATFORMTHEME=qt6ct, which config/environment.d/qt.conf exports for the
; systemd user session and hyprland.lua sets for apps the compositor starts.

[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=$HOME/.config/qt6ct/colors/theme.conf
standard_dialogs=default
icon_theme=Adwaita

[Interface]
double_click_interval=400
underline_shortcut=1
wheel_scroll_lines=3
