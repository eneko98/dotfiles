# Generated by scripts/gen-theme.py from config/hypr/theme.lua.
# Do not edit this file: edit the palette and re-run the script.
# `scripts/gen-theme.py --check` reports whether this copy is stale.

# This overrides the chrome in yazi's default dark theme. Filetype and icon
# colours are left as named ANSI colours, which resolve to our own ANSI 16.
#
# Note: [mgr] and [tabs] overrides are ignored by yazi 26.9.1 in our tests
# (the CWD and tab bar stay on the default ANSI colours), so we leave them
# alone. The defaults already sit on our palette: cyan for CWD, blue for the
# active tab, so the result is still coherent.

[mode]
normal_main = { fg = "#0a0708", bg = "#d3a75a", bold = true }
normal_alt = { fg = "#d3a75a", bg = "#151011" }
select_main = { fg = "#0a0708", bg = "#c2452f", bold = true }
select_alt = { fg = "#c2452f", bg = "#151011" }
unset_main = { fg = "#0a0708", bg = "#c2452f", bold = true }
unset_alt = { fg = "#c2452f", bg = "#151011" }

[indicator]
