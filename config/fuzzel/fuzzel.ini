# fuzzel -- the application launcher, on SUPER + Space.
#
# Chosen because it is small (328 KiB) and toolkit-free: no GTK, no X11, only
# wayland, cairo, fontconfig and a few drawing libraries. wofi would have pulled
# in GTK and dmenu is an X11 program that would need XWayland.
#
# It is also the first place the palette needed a *fourth* copy, and the reason
# scripts/gen-theme.py exists: the colours below are not written here, they are
# generated from config/hypr/theme.lua -- the same values the window borders, the
# terminal and the shell prompt use. Run `scripts/gen-theme.py` after changing
# the palette.
#
# Handy:
#   fuzzel                      the launcher, as SUPER + Space runs it
#   fuzzel --check-config       verify this file, exit non-zero if it is broken
#   printf 'one\ntwo\n' | fuzzel --dmenu    any list as a menu
#
# The animation when it opens or closes is not fuzzel's doing: Hyprland animates
# layer surfaces itself (animation leaves "layersIn"/"layersOut", per namespace
# via layer rules), so the pop-in arrives with the animation pass.

# fuzzel does not resolve relative includes -- the path must be absolute or start
# with ~/. Naming the *installed* location rather than the repo keeps this line
# correct no matter where the repository is cloned.
include=~/.config/fuzzel/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=11

# Do not size text by the monitor's reported DPI. This panel claims 310x170 mm for
# 1920x1080, i.e. ~158 PPI, which is wrong, and dpi-aware=auto believes it: the
# window came out 668x325 with this setting and 416x208 without, a 1.6x inflation
# that would make the launcher's text visibly bigger than the terminal's. Sizing by
# the compositor's scale instead is the same call made for the monitor scale itself
# in hyprland.lua. Not a preference -- the panel lies.
dpi-aware=no

# The icon theme is generated into colors.ini from the accent, so the launcher
# does not disagree with GTK and Qt.
icons-enabled=yes

# The same ❯ the shell prompt uses, so the two prompts look related.
prompt="❯ "
placeholder=Search applications…

# fuzzel has a "terminal" setting for launching terminal programs from the
# launcher, so a .desktop file that asks for a terminal gets kitty.
terminal=kitty -e

anchor=center
width=42
lines=8
horizontal-pad=18
vertical-pad=10
inner-pad=6

# fzf-style matching: "dkf" finds "dotfiles". This is the default, spelled out
# because it is the setting that decides whether searching feels right.
match-mode=fzf

[border]
# 1px was so thin the border colour almost disappeared against the wallpaper.
# 2px is the smallest value where it reads as a coloured edge rather than a hair.
width=2
radius=10

[dmenu]
# Scripts use fuzzel as a general menu (a power menu, later a clipboard picker).
# Nothing on stdin means there is nothing to pick, so do not open an empty box.
exit-immediately-if-empty=yes
