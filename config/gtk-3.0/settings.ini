# GTK3 settings for this user.
#
# gtk-theme-name stays Adwaita on purpose: Adwaita is compiled into libgtk-3,
# there is no theme directory to fork. What makes it ours is the gtk.css sitting
# beside this file, which redefines Adwaita's named colours from theme.lua.
# prefer-dark selects the dark variant of Adwaita as the base.
#
# GTK4 is a separate story (config/gtk-4.0/): libadwaita mostly ignores the theme
# name and honours dark plus an accent, so it needs its own file.

[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Adwaita
gtk-enable-animations=1
