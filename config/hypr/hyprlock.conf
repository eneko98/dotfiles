# The lock screen. hyprlock is a hyprlang program, not Lua, so the palette
# arrives through the generated source below rather than from theme.lua.
#
# `path = screenshot` locks the screen you were looking at and blurs it, which
# means no wallpaper path has to be hardcoded here.
source = ~/.config/hypr/hyprlock-theme.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    color = $bg0
}

input-field {
    monitor =
    size = 24%, 6%
    outline_thickness = 2
    rounding = 8
    inner_color = rgba(00000000) # no fill, only the outline
    outer_color = $gold          # the one accent, same as the active border
    check_color = $teal          # teal is "the live thing", as everywhere else
    fail_color = $red            # red only ever means a failure
    font_color = $fg0
    fade_on_empty = false
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    placeholder_text = Enter password
    fail_text = <i>$PAMFAIL</i>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $fg0
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = $fg1
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  $USER
    font_size = 16
    font_family = $font
    color = $fg2
    position = 0, -180
    halign = center
    valign = center
}
