# Idle behaviour. hypridle watches inactivity, and also the DBus
# prepare_sleep event that logind sends before a suspend -- which is what a lid
# close triggers, since logind's own default is HandleLidSwitch=suspend.
#
# The lock itself is hyprlock. `pidof hyprlock || hyprlock` prevents a second
# lock stacking on top of the first when a timeout and a sleep arrive together.
#
# hypridle is a systemd user unit the package ships; it is enabled once, outside
# this repo:
#     systemctl --user enable --now hypridle.service

general {
    lock_cmd = $HOME/.config/hypr/scripts/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock after 5 minutes. `loginctl lock-session` is a DBus event, which hypridle
# picks up and turns into lock_cmd -- one code path for lid, timeout and keybind.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 10 minutes. on-resume wakes it again the moment there is
# input, so the lock screen is already there when you look back.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30 minutes idle. This goes through the same prepare_sleep path
# as the lid, so the session is locked before the machine sleeps.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
