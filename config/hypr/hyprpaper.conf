# hyprpaper configuration.
#
# This is hyprlang, not Lua. Hyprland itself moved to the Lua API in 0.55, but the
# side tools (hyprpaper, hyprlock, hypridle) have not, so both syntaxes live under
# config/hypr/. That is expected, not a leftover.
#
# The file is read once, at startup. Everything in it can also be driven at runtime
# over IPC, which is exactly why hyprpaper was picked over swaybg:
#
#   hyprctl hyprpaper wallpaper ', ~/repos/dotfiles/images/wallpapers/default.png'
#   hyprctl hyprpaper listactive
#
# The empty monitor name is a fallback rule: it applies to any output that has no
# more specific entry, so the config keeps working if this laptop's panel name ever
# changes or an external screen is plugged in. Same idea as hl.monitor({ output = "" }).

wallpaper {
    monitor =
    path = ~/repos/dotfiles/images/wallpapers/default.png
    # cover fills the output and only crops if the image is not 16:9. The committed
    # file is already exactly 1920x1080, so in practice nothing is scaled or cropped.
    fit_mode = cover
}

# hyprpaper is able to paint Hyprland's logo over the wallpaper at startup. Not wanted.
splash = false

# Live changes through `hyprctl hyprpaper`; see above.
ipc = true
